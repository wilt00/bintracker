name: Windows release

on:
  push:
    branches:
      - personal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  TCLKIT_URL: https://tclkits.rkeene.org/fossil/raw/tclkit-8.6.3-win32-x86_64.exe?name=403c507437d0b10035c7839f22f5bb806ec1f491
  TCLKIT_SHA256: 5292399891398ce13af0e32fa98dab02e6f0134ea9738515649d7e649eff0942

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $date = [DateTime]::UtcNow.ToString('yyyy.MMdd')
          "version=$date.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT

      - name: Cache Tclkit
        id: cache-tclkit
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\tclkit\tclkit.exe
          key: tclkit-8.6.3-win32-x86_64-${{ env.TCLKIT_SHA256 }}

      - name: Download Tclkit
        if: steps.cache-tclkit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'tclkit\tclkit.exe'
          New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
          Invoke-WebRequest -UseBasicParsing $env:TCLKIT_URL -OutFile $destination

      - name: Verify Tclkit
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'tclkit\tclkit.exe'
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TCLKIT_SHA256) {
            throw "Tclkit checksum mismatch: $actual"
          }

      - name: Pass Tclkit to build jobs
        uses: actions/upload-artifact@v7
        with:
          name: tclkit
          path: ${{ runner.temp }}\tclkit\tclkit.exe
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            runner: windows-latest
            arch: x64
            prefix: ucrt64
            object-arch: i386:x86-64
            chicken-package: https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-chicken-5.4.0-1-any.pkg.tar.zst
            chicken-sha256: 56b8e231ce00fa5812d4d2b77f8a5d288298596c71bd0316980ca36ffd94302e
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Configure LF checkouts
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out the exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify script line endings
        shell: pwsh
        run: |
          $scripts = git ls-files '*.scm' '*.lua' '*.sh' 'build/Makefile*'
          $withCr = foreach ($script in $scripts) {
            if ([IO.File]::ReadAllBytes((Resolve-Path $script)) -contains 13) { $script }
          }
          if ($withCr) { throw "CRLF found in scripts: $($withCr -join ', ')" }

      - name: Set up MSYS2 ${{ matrix.msystem }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            curl
            make
            unzip
            zip
          pacboy: >-
            toolchain:p
            sqlite3:p

      - name: Cache Chicken package
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\chicken-5.4.pkg.tar.zst
          key: chicken-package-${{ matrix.msystem }}-${{ matrix.chicken-sha256 }}

      - name: Install Chicken 5.4
        run: |
          package="$RUNNER_TEMP/chicken-5.4.pkg.tar.zst"
          if ! test -f "$package"; then
            curl --fail --location '${{ matrix.chicken-package }}' --output "$package"
          fi
          echo '${{ matrix.chicken-sha256 }}  '"$package" | sha256sum --check
          pacman --noconfirm -U "$package"

      - name: Determine Chicken version
        id: chicken
        run: |
          package="${MINGW_PACKAGE_PREFIX}-chicken"
          echo "version=$(pacman -Q "$package" | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Map Chicken's native prefix
        shell: pwsh
        run: |
          # Chicken 5.4 embeds /ucrt64 paths. Native Windows tools resolve those
          # from the current drive rather than through MSYS2's mount table.
          $target = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'msys64\${{ matrix.prefix }}')).Path
          $roots = @(
            [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
            [IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          ) | Sort-Object -Unique

          foreach ($root in $roots) {
            $link = Join-Path $root '${{ matrix.prefix }}'
            if (Test-Path -LiteralPath $link) {
              throw "Refusing to replace existing path: $link"
            }
            New-Item -ItemType Junction -Path $link -Target $target | Out-Null
            Write-Host "Mapped $link to $target"
          }

          # Keep generated .bat files on a drive where the same junction exists.
          $eggCache = Join-Path $env:RUNNER_TEMP 'chicken-install'
          New-Item -ItemType Directory -Force -Path $eggCache | Out-Null
          "CHICKEN_EGG_CACHE=$eggCache" >> $env:GITHUB_ENV

      - name: Cache Chicken eggs
        id: cache-eggs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\msys64\${{ matrix.prefix }}\lib\chicken\11
          key: chicken-eggs-v1-${{ matrix.msystem }}-${{ steps.chicken.outputs.version }}

      - name: Install Chicken eggs
        if: steps.cache-eggs.outputs.cache-hit != 'true'
        run: .github/scripts/install-chicken-eggs.sh

      - name: Add Tclkit
        uses: actions/download-artifact@v8
        with:
          name: tclkit
          path: 3rdparty

      - name: Build and test
        env:
          OBJECT_ARCH: ${{ matrix.object-arch }}
        run: .github/scripts/build-test.sh

      - name: Test bundled Tclkit
        run: .github/scripts/test-tclkit.sh

      - name: Smoke-test Bintracker startup
        shell: pwsh
        run: .github/scripts/test-bintracker.ps1

      - name: Create portable archive
        env:
          ARCH: ${{ matrix.arch }}
        run: .github/scripts/create-portable-archive.sh

      - name: Upload ${{ matrix.arch }} package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: bintracker-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Verify assets and create checksums
        run: |
          set -euo pipefail
          test -f dist/bintracker-windows-x64.zip
          (cd dist && sha256sum -- ./*.zip > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          Windows packages built from commit \`${GITHUB_SHA}\`.

          - \`bintracker-windows-x64.zip\`: MSYS2 UCRT64 build

          Tclkit is bundled. MAME is not bundled; install it globally so \`mame.exe\` is available on \`PATH\`.
          EOF
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Bintracker ${VERSION}" \
            --notes-file release-notes.md
